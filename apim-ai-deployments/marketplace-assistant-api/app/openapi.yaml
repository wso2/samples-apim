openapi: 3.0.0
info:
  title: API Marketplace Chatbot
  version: 0.1.0
paths:
  /marketplace-assistant:
    post:
      summary: Marketplace Assistant
      operationId: marketplace_assistant_marketplace_assistant_post
      parameters:
        - required: true
          schema:
            type: string
            title: Orgid
          name: orgID
          in: query
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Query'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /marketplace-assistant/streaming:
    post:
      summary: Marketplace Assistant Sse
      operationId: marketplace_assistant_sse_marketplace_assistant_streaming_post
      parameters:
        - required: true
          schema:
            type: string
            title: Orgid
          name: orgID
          in: query
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Query'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /health:
    get:
      summary: Health
      description: Check the api is running
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Query:
      properties:
        query:
          type: string
          title: Query
        history:
          items: {}
          type: array
          title: History
        tenant_domain:
          type: string
          title: Tenant Domain
      type: object
      required:
        - query
        - history
      title: Query
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
              - type: string
              - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
        - loc
        - msg
        - type
      title: ValidationError
