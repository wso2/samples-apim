[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tool-poisoning-classifier"
version = "0.1.0"
description = "Internal HTTP service that scores MCP tool metadata with the wso2/tool-poisoning-detection SetFit model"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  # Web layer.
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
  "anyio>=4.0,<5.0",
  # Model stack. setfit==1.1.3 and transformers<5.0.0 are the versions the
  # wso2/tool-poisoning-detection model card specifies; the service verifies
  # them at startup.
  "setfit==1.1.3",
  "transformers>=4.57,<5.0.0",
  "sentence-transformers>=5.0,<6.0",
  # Pinned exactly: model_head.pkl was pickled by scikit-learn 1.8.0.
  "scikit-learn==1.8.0",
  "torch>=2.4,<3.0",
  "huggingface-hub>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tool_poisoning_classifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
