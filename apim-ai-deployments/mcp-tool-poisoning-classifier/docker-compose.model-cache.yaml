#
# Override for an image built WITHOUT the model. The pinned revision is
# downloaded from huggingface.co on first start and kept in a named volume, so
# later starts do not download it again.
#
#   docker compose -f docker-compose.yaml -f docker-compose.model-cache.yaml up --build -d
#
# Use this only when you intentionally want a smaller image. The default,
# model-baked image needs no volume and no egress: a persistent cache mounted
# over a baked image would hide the model shipped in a newer image behind the
# stale copy in the volume.

services:
  mcp-tool-poisoning-classifier:
    build:
      args:
        PREFETCH_MODEL: "false"
        HF_HUB_OFFLINE: "0"
    image: mcp-tool-poisoning-classifier:0.1.0-model-cache
    environment:
      HF_HUB_OFFLINE: "0"
    volumes:
      - models:/models

volumes:
  models:
